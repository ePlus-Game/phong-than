name: Windows PAK extractor build
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-pak-extractor.yml'
      - 'PhongThanSource/Build/Build-PakEntryExtract-Modern.ps1'
      - 'PhongThanSource/Tests/Native/PakEntryExtract.cpp'
      - 'AdminWeb/PhongThan-Admin.ps1'
      - 'PhongThanSource/Sources/Engine/**'
      - 'PhongThanSource/Build/Build-Modern.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-reader:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanSource/Build/Build-Modern.ps1
            /PhongThanSource/Build/Build-PakEntryExtract-Modern.ps1
            /PhongThanSource/Tests/Native/PakEntryExtract.cpp
            /PhongThanSource/Headers/
            /PhongThanSource/Lib/release/
            /PhongThanSource/Sources/Engine/Engine.dsp
            /PhongThanSource/Sources/Library/LuaLib/LuaLibDll.dsp
            /PhongThanSource/Sources/Library/LuaLib/src/
            /PhongThanSource/Sources/Engine/Include/
            /PhongThanSource/Sources/Engine/Src/
            /PhongThanSource/Sources/Represent/iRepresent/
            /PhongThanSource/Sources/Pack/ucl-1.01/include/
            /PhongThanSource/ThirdParty/WindowsSDK/GDIPlus/Include/
            /PhongThanSource/ThirdParty/WindowsSDK/GDIPlus/Lib/x86/
            /PhongThanSource/ThirdParty/dx9csdk/Include/
            /PhongThanSource/ThirdParty/dx9csdk/Lib/
      - name: Build fresh LuaLibDll and Engine with MSVC x86 (not runtime)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\PhongThanSource\Build\Build-Modern.ps1 -Targets @('LuaLibDll','Engine') -Jobs 2 -Clean
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Engine build failed' }
      - name: Build isolated PAK extractor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\PhongThanSource\Build\Build-PakEntryExtract-Modern.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PAK extractor build failed' }
      - name: Validate binary format and startup (not real game)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='PhongThanSource\OutputModern\Tools'
          $exe=Join-Path $out 'PakEntryExtract.exe'
          foreach($p in @($exe,(Join-Path $out 'Engine.dll'),(Join-Path $out 'LuaLibDll.dll'))) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing tool file: $p" }
            $bytes=[IO.File]::ReadAllBytes((Resolve-Path $p).Path)
            if ($bytes.Length -lt 1024 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Invalid PE: $p" }
            $offset=[BitConverter]::ToInt32($bytes,0x3c)
            if ($offset -lt 0 -or $offset+6 -gt $bytes.Length -or [BitConverter]::ToUInt16($bytes,$offset+4) -ne 0x14c) { throw "Not x86: $p" }
          }
          $p=Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $out).Path -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 2) { throw "Cannot start isolated extractor: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: phongthan-pak-extractor-win32
          path: |
            PhongThanSource/OutputModern/Tools/PakEntryExtract.exe
            PhongThanSource/OutputModern/Tools/Engine.dll
            PhongThanSource/OutputModern/Tools/LuaLibDll.dll
          if-no-files-found: error
          retention-days: 14
