name: Windows live readiness evidence tool tests

on:
  pull_request:
    paths:
      - 'tools/Read-WindowsRuntimeEvidence.ps1'
      - 'tools/Diagnose-WorldRegistration.ps1'
      - 'tests/Test-WorldRegistrationDiagnosis.ps1'
      - 'PhongThanSource/Sources/Core/Src/KSubWorldSet.cpp'
      - 'PhongThanSource/Sources/MultiServer/GameServer/KSOServer.cpp'
      - 'PhongThanSource/Sources/MultiServer/Bishop/GameServer.cpp'
      - 'tests/Test-WindowsRuntimeEvidence.ps1'
      - 'tools/Restore-SplitPaks.ps1'
      - 'tests/Test-RestoreSplitPaks.ps1'
      - 'AdminWeb/PhongThan-RunAll.ps1'
      - 'AdminWeb/PhongThan-Admin-Console.ps1'
      - 'AdminWeb/PhongThan-Admin.ps1'
      - 'AdminWeb/Initialize-ItemTables.ps1'
      - 'tests/Test-AdminItemTables.ps1'
      - 'tests/Test-RunAllReadiness.ps1'
      - 'PhongThanSource/Tests/Test-NativeRuntime.ps1'
      - '.github/workflows/windows-runtime-live-evidence.yml'
permissions:
  contents: read

concurrency:
  group: windows-runtime-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-readiness-helpers:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/Read-WindowsRuntimeEvidence.ps1
            /tools/Diagnose-WorldRegistration.ps1
            /tests/Test-WorldRegistrationDiagnosis.ps1
            /PhongThanSource/Sources/Core/Src/KSubWorldSet.cpp
            /PhongThanSource/Sources/MultiServer/GameServer/KSOServer.cpp
            /PhongThanSource/Sources/MultiServer/Bishop/GameServer.cpp
            /tests/Test-WindowsRuntimeEvidence.ps1
            /tools/Restore-SplitPaks.ps1
            /tests/Test-RestoreSplitPaks.ps1
            /AdminWeb/PhongThan-RunAll.ps1
            /AdminWeb/PhongThan-Admin-Console.ps1
            /AdminWeb/PhongThan-Admin.ps1
            /AdminWeb/Initialize-ItemTables.ps1
            /tests/Test-AdminItemTables.ps1
            /tests/Test-RunAllReadiness.ps1
      - name: Verify AST syntax, world marker and port ownership
        shell: powershell
        run: |
          & .\tests\Test-WindowsRuntimeEvidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore split PAKs without Python (synthetic fixture)
        shell: powershell
        run: |
          & .\tests\Test-RestoreSplitPaks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reused cluster must pass WORLD_READY gate
        shell: powershell
        run: |
          & .\tests\Test-RunAllReadiness.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose WORLD_READY using synthetic logs only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\Test-WorldRegistrationDiagnosis.ps1 -RepoRoot (Get-Location).Path
          # Test throws for failed assertions; do not inherit LASTEXITCODE from nested external commands.
      - name: Check map and Bishop logging instrumentation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $core=Get-Content -LiteralPath 'PhongThanSource/Sources/Core/Src/KSubWorldSet.cpp' -Raw
          $game=Get-Content -LiteralPath 'PhongThanSource/Sources/MultiServer/GameServer/KSOServer.cpp' -Raw
          $bishop=Get-Content -LiteralPath 'PhongThanSource/Sources/MultiServer/Bishop/GameServer.cpp' -Raw
          if ($core.Contains('total=%d\\n')) { throw 'Core map loader still writes literal escaped newlines' }
          if (-not $core.Contains('total=%d\n')) { throw 'Map progress log format missing' }
          foreach($event in @('world_map_count_invalid','world_registry_sent','world_hello_send_failed')) {
            if (-not $game.Contains($event)) { throw "GameServer diagnostic missing: $event" }
          }
          foreach($event in @('registry_accepted','registry_rejected','map_id_rejected','ready_log_open_failed')) {
            if (-not $bishop.Contains($event)) { throw "Bishop diagnostic missing: $event" }
          }
          Write-Host 'PASS: source contains map and handshake event diagnostics'
      - name: Missing PAK extractor uses safe item catalog fallback
        shell: powershell
        run: |
          & .\tests\Test-AdminItemTables.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
