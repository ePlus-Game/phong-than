name: Legacy recovery build and inventory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The byte-exact PT.zip mirror is enormous: download only sources
          # needed for portable build and tests, not runtime game assets.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Base/
            /Client/
            /Server/
            /Share/
            /tools/
            /tests/
            /CMakeLists.txt
            /source/PT/PhongThanSource/Sources/MultiServer/GameServer/GameServer.cpp
            /source/PT/PhongThanSource/Sources/AccountServices/AccountServer/S3PDBSocketPool.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete static audit unit suite
        run: python -m unittest discover -s tests -v
      - name: Inventory original VC6 dependencies and assets
        run: |
          mkdir -p reports
          python tools/audit_legacy_projects.py --json reports/projects.json --markdown reports/projects.md
          python tools/recovery_inventory.py --json reports/dependencies.json --markdown reports/dependencies.md
      - name: Configure integrated portable C compilation
        run: cmake -S . -B "$RUNNER_TEMP/pt-recovery" -DCMAKE_BUILD_TYPE=Release
      - name: Compile Lua and portable Common subset
        run: cmake --build "$RUNNER_TEMP/pt-recovery" --parallel 2
      - name: Execute isolated CRC32 known-vector test
        run: ctest --test-dir "$RUNNER_TEMP/pt-recovery" --output-on-failure
      - name: Confirm both compiled archives exist
        run: |
          test -s "$RUNNER_TEMP/pt-recovery/Base/LuaLib/libpt_legacy_lua.a"
          test -s "$RUNNER_TEMP/pt-recovery/Base/Common/libpt_common_portable.a"
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-recovery-reports
          path: reports/
          if-no-files-found: warn

  windows-x86-experimental:
    name: Windows x86 portable compilation (not VC6)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The byte-exact PT.zip mirror is enormous: download only sources
          # needed for portable build and tests, not runtime game assets.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Base/
            /Client/
            /Server/
            /Share/
            /tools/
            /tests/
            /CMakeLists.txt
            /source/PT/PhongThanSource/Sources/MultiServer/GameServer/GameServer.cpp
            /source/PT/PhongThanSource/Sources/AccountServices/AccountServer/S3PDBSocketPool.cpp
      - name: Preflight original VC6 build matrix (Release and Debug, no MSDEV)
        shell: pwsh
        run: |
          ./tools/build-vc6-all.ps1 -DryRun -Configuration Release
          ./tools/build-vc6-all.ps1 -DryRun -Configuration Debug
      - name: Configure MSVC 2026 Win32 isolated portable subset
        shell: pwsh
        run: cmake -S . -B "$env:RUNNER_TEMP\pt-recovery-x86" -G "Visual Studio 18 2026" -A Win32
      - name: Compile Lua and CRC32/miniLZO with MSVC x86
        shell: pwsh
        run: cmake --build "$env:RUNNER_TEMP\pt-recovery-x86" --config Release --parallel 2
      - name: Verify CRC32 known vector under Windows x86
        shell: pwsh
        run: ctest --test-dir "$env:RUNNER_TEMP\pt-recovery-x86" -C Release --output-on-failure
