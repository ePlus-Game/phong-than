name: Vietnamese Admin and legacy Client text
on:
  pull_request:
    branches: [main]
    paths:
      - 'AdminWeb/index.html'
      - 'AdminWeb/locales/vi-VN.json'
      - 'AdminWeb/Ui-Localization.ps1'
      - 'AdminWeb/PhongThan-Admin.ps1'
      - 'tests/Test-AdminLocalization.ps1'
      - 'tests/admin_locale.test.cjs'
      - 'PhongThanRuntime-Staging/Client/Ui/Setting.ini'
      - '.github/workflows/admin-locale-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locale-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AdminWeb/index.html
            /AdminWeb/locales/vi-VN.json
            /AdminWeb/Ui-Localization.ps1
            /tests/Test-AdminLocalization.ps1
            /AdminWeb/PhongThan-Admin.ps1
            /tests/admin_locale.test.cjs
            /tests/admin_workspace.test.cjs
            /PhongThanRuntime-Staging/Client/Ui/Setting.ini
            /PhongThanRuntime-Staging/Client/font/14.fnt
            /PhongThanRuntime-Staging/Client/font/16.fnt
            /PhongThanRuntime-Staging/Client/font/18.fnt
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate Vietnamese labels, API error localization and TCVN3 bytes
        run: node --test tests/admin_locale.test.cjs tests/admin_workspace.test.cjs

  powershell-locale:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AdminWeb/PhongThan-Admin.ps1
            /AdminWeb/Ui-Localization.ps1
            /AdminWeb/locales/vi-VN.json
            /tests/Test-AdminLocalization.ps1
      - name: Verify Windows PowerShell 5.1 reads UTF-8 and localizes API JSON safely
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\Test-AdminLocalization.ps1 -RepoRoot (Get-Location).Path
