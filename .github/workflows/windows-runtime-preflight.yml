name: Windows runtime read-only preflight tests

on:
  pull_request:
    paths:
      - 'tools/runtime_preflight.py'
      - 'tools/verify_windows_build.py'
      - 'tests/test_runtime_preflight.py'
      - '.github/workflows/windows-runtime-preflight.yml'
      - 'PhongThanSource/Deploy/RUNTIME_CONTENT_MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-read-only-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/runtime_preflight.py
            /tools/verify_windows_build.py
            /tests/test_runtime_preflight.py
            /PhongThanSource/Deploy/RUNTIME_CONTENT_MANIFEST.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Synthetic PE32 and isolated runtime preflight tests
        run: python -m unittest discover -s tests -p test_runtime_preflight.py -v
      - name: Ensure probe does not run game or contact DB
        shell: pwsh
        run: |
          $script = Get-Content tools/runtime_preflight.py -Raw
          if ($script -match 'subprocess|Start-Process|Stop-Process|sqlcmd|sqlite3\.connect') {
            throw 'Read-only preflight unexpectedly gained process/DB access.'
          }
