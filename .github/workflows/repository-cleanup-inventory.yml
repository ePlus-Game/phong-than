name: Repository cleanup inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Git tree without file blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init inventory
          cd inventory
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${GITHUB_SHA}"
          git update-ref refs/heads/main "$(git rev-parse FETCH_HEAD)"
          git symbolic-ref HEAD refs/heads/main
          git checkout HEAD -- tools/repository_hygiene.py
      - name: Print aggregate metadata only
        shell: bash
        run: |
          set -euo pipefail
          cd inventory
          python3 tools/repository_hygiene.py --no-sizes --format markdown >> "$GITHUB_STEP_SUMMARY"
          python3 tools/repository_hygiene.py --no-sizes --format markdown
      - name: Redact authentication URL
        if: always()
        shell: bash
        run: |
          git -C inventory remote remove origin || true
