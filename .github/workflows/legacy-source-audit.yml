name: PT archive recovery tooling checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid downloading multi-GiB PAKs from the exact ZIP mirror.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /tests/
            /PhongThanSource/Sources/MultiServer/GameServer/GameServer.cpp
            /PhongThanSource/Sources/AccountServices/AccountServer/S3PDBSocketPool.cpp
            /PhongThanSource/Build/Build-Modern.ps1
            /PhongThanSource/Build/Build-PhongThan.ps1
            /docs/LEGACY_HARDENING.md
            /docs/releases/v0.1.0-recovery.1.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test recovery tooling and original patch contexts
        run: python -m unittest discover -s tests -v
      - name: Validate separate build workspace preflight
        run: |
          python -m tools.release_preflight \
            --source-root PhongThanSource \
            --workspace "$RUNNER_TEMP/pt-build-check" \
            --toolchain Modern
      - name: Audit public tracked filenames only (informational)
        run: |
          python tools/audit_sensitive_paths.py --json public-risk-audit.json --markdown public-risk-audit.md
          cat public-risk-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-archive-filename-audit
          path: public-risk-audit.*
          if-no-files-found: warn
