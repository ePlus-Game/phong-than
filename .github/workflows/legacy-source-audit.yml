name: PT archive recovery tooling checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pt-tooling-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid downloading multi-GiB PAKs from the exact ZIP mirror.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /tests/
            /overlays/
            /PhongThanSource/Sources/MultiServer/GameServer/GameServer.cpp
            /PhongThanSource/Sources/MultiServer/GameServer/KSOServer.cpp
            /PhongThanSource/Sources/AccountServices/AccountServer/S3PDBSocketPool.cpp
            /PhongThanSource/Sources/AccountServices/AccountServer/main.cpp
            /PhongThanSource/Sources/AccountServices/AccountServer/GlobalFun.h
            /PhongThanSource/Build/Build-Modern.ps1
            /PhongThanSource/Build/Build-PhongThan.ps1
            /PhongThanSource/Deploy/ProjectContent/script/servertimer.lua
            /PhongThanRuntime-Staging/Server/script/phongthan/sinhhoat/lt_npc.lua
            /PhongThanRuntime-Staging/Server/script/phongthan/sinhhoat/sh_lib.lua
            /PhongThanRuntime-Staging/Server/script/phongthan/content/dg_lib.lua
            /PhongThanRuntime-Staging/Client/Ui/Setting.ini
            /PhongThanRuntime-Staging/Client/serverlist.ini
            /AdminWeb/index.html
            /AdminWeb/PhongThan-Setup.ps1
            /install/README.md
            /PhongThan-MoGame.cmd
            /AdminWeb/PhongThan-RunAll.ps1
            /AdminWeb/PhongThan-ClientPatch.ps1
            /PhongThan-Admin.cmd
            /PhongThan-CaiDat.cmd
            /PhongThan-ChayTatCa.cmd
            /PhongThan-BangDieuKhien.cmd
            /PhongThanSource/Deploy/PhongThan-Control.ps1
            /PhongThanSource/Deploy/PhongThan-AccountForm.ps1
            /PhongThanSource/Sources/GameClient/PhongThanClient.cpp
            /README.md
            /docs/BRANDING.md
            /docs/LEGACY_HARDENING.md
            /docs/LAUNCHER_BEHAVIOR.md
            /docs/releases/v0.1.0-recovery.1.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check Python tools and tests
        run: python -m compileall -q tools tests
      - name: Test recovery tooling, patches, rewards and game-data contracts
        run: python -m unittest discover -s tests -v
      - name: Summarize tracked archive and generated-file clutter (metadata only)
        run: |
          python tools/repository_hygiene.py --format markdown --output "$RUNNER_TEMP/repository-hygiene.md"
          cat "$RUNNER_TEMP/repository-hygiene.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate Phong Than Truyen Ky branded UI overlay
        run: python tools/build_branding_overlay.py --output-dir "$RUNNER_TEMP/PhongThanTruyenKy-Branding" --write
      - uses: actions/upload-artifact@v4
        with:
          name: phong-than-truyen-ky-branding-overlay
          path: ${{ runner.temp }}/PhongThanTruyenKy-Branding/
          if-no-files-found: error
      - name: Compile and run portable C++98 endpoint parser tests
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror -pedantic tests/cpp/test_gateway_endpoint.cpp -o "$RUNNER_TEMP/pt-gateway-test"
          "$RUNNER_TEMP/pt-gateway-test"
      - name: Compile C++98 packet boundary tests
        run: |
          g++ -std=c++98 -Wall -Wextra -Werror -pedantic tests/cpp/test_account_packet_bounds.cpp -o "$RUNNER_TEMP/pt-account-bounds"
          "$RUNNER_TEMP/pt-account-bounds"
      - name: Validate separate build workspace preflight
        run: |
          python -m tools.release_preflight \
            --source-root PhongThanSource \
            --workspace "$RUNNER_TEMP/pt-build-check" \
            --toolchain Modern
      - name: Audit public tracked filenames only (informational)
        run: |
          python tools/audit_sensitive_paths.py --json public-risk-audit.json --markdown public-risk-audit.md
          cat public-risk-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-archive-filename-audit
          path: public-risk-audit.*
          if-no-files-found: warn
