name: Windows x86 native server build (hosted, no runtime)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-server-modules.yml'
      - 'PhongThanSource/Build/Build-Modern.ps1'
      - 'PhongThanSource/Sources/MultiServer/**'
      - 'PhongThanSource/Sources/AccountServices/AccountServer/**'
      - 'PhongThanSource/Sources/Core/**'
      - 'PhongThanSource/Sources/Engine/**'
      - 'PhongThanSource/Headers/**'
      - 'tools/verify_native_module_build.py'
      - 'tools/stage_accountserver_smoke.py'
      - 'tools/legacy_hardening.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-server-modules.yml'
      - 'PhongThanSource/Build/Build-Modern.ps1'
      - 'PhongThanSource/Sources/MultiServer/**'
      - 'PhongThanSource/Sources/AccountServices/AccountServer/**'
      - 'PhongThanSource/Sources/Core/**'
      - 'PhongThanSource/Sources/Engine/**'
      - 'tools/verify_native_module_build.py'
      - 'tools/stage_accountserver_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pt-server-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-server:
    runs-on: windows-2022
    timeout-minutes: 95
    steps:
      - name: Sparse checkout native source; exclude actual game state
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanSource/Build/Build-Modern.ps1
            /PhongThanSource/Headers/
            /PhongThanSource/Lib/release/
            /PhongThanSource/Sources/Core/Core.dsp
            /PhongThanSource/Sources/Core/Src/
            /PhongThanSource/Sources/Engine/Engine.dsp
            /PhongThanSource/Sources/Engine/Include/
            /PhongThanSource/Sources/Engine/Src/
            /PhongThanSource/Sources/Represent/iRepresent/
            /PhongThanSource/Sources/MultiServer/Common/
            /PhongThanSource/Sources/MultiServer/Heaven/
            /PhongThanSource/Sources/MultiServer/Rainbow/
            /PhongThanSource/Sources/MultiServer/PhongThanRelay/
            /PhongThanSource/Sources/MultiServer/Bishop/
            /PhongThanSource/Sources/MultiServer/Goddess/
            /PhongThanSource/Sources/MultiServer/GameServer/
            /PhongThanSource/Sources/AccountServices/AccountServer/
            /PhongThanSource/Sources/AccountServices/RelayServer/*.h
            /PhongThanSource/Sources/GameClient/Ui/UiCase/
            /PhongThanSource/Sources/GameClient/Ui/Elem/
            /PhongThanSource/Sources/GameClient/Ui/*.h
            /PhongThanSource/Sources/Library/LuaLib/LuaLibDll.dsp
            /PhongThanSource/Sources/Library/LuaLib/src/
            /PhongThanSource/Sources/ExpandPackageStaticLib/
            /PhongThanSource/Sources/ExpandPackage2.0/
            /PhongThanSource/Sources/FilterText/
            /PhongThanSource/Sources/Pack/ucl-1.01/include/
            /PhongThanSource/ThirdParty/WindowsSDK/GDIPlus/Include/
            /PhongThanSource/ThirdParty/WindowsSDK/GDIPlus/Lib/x86/
            /PhongThanSource/ThirdParty/dx9csdk/Include/
            /PhongThanSource/ThirdParty/dx9csdk/Lib/
            /tools/verify_windows_build.py
            /tools/verify_native_module_build.py
            /tools/stage_accountserver_smoke.py
            /tools/legacy_hardening.py
            /overlays/legacy/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create fresh external source copy and stage AccountServer compatibility fixes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'PhongThanSource').Path
          foreach ($old in @('Output', 'OutputModern', 'Build/LogsModern')) {
            if (Test-Path -LiteralPath (Join-Path $source $old)) { throw "Unexpected checked out build output: $old" }
          }
          if (Test-Path -LiteralPath 'PhongThanRuntime-Staging') { throw 'Refusing checked out runtime/character data' }
          $work = Join-Path $env:RUNNER_TEMP ("pt-server-${{ github.run_id }}-${{ github.run_attempt }}")
          if (Test-Path -LiteralPath $work) { throw 'Refusing reused build directory' }
          Copy-Item -LiteralPath $source -Destination $work -Recurse -ErrorAction Stop
          & python -m tools.stage_accountserver_smoke --target $work
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage AccountServer compatibility overlay' }
          "PT_SERVER_WORKSPACE=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Only external copied source was patched; no game process or database accessed.'

      - name: Compile all server modules and their libraries from source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'LuaLibDll','Engine','Common','ExpandPackageStaticLib','FilterTextStatic',
            'CoreServer','ExpandPackage','FilterText','Heaven','Rainbow',
            'PhongThanRelay','AccountServer','Bishop','Goddess','GameServer'
          )
          & (Join-Path $env:PT_SERVER_WORKSPACE 'Build/Build-Modern.ps1') -Targets $targets -Jobs 2 -Clean -KeepGoing
          if ($LASTEXITCODE -ne 0) { throw 'Native server build failed; module diagnostics are reported in verification step' }

      - name: Validate fresh server EXE/DLL and COFF libraries, print failures
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $modules = @(
            'LuaLibDll','Engine','Common','ExpandPackageStaticLib','FilterTextStatic',
            'CoreServer','ExpandPackage','FilterText','Heaven','Rainbow',
            'PhongThanRelay','AccountServer','Bishop','Goddess','GameServer'
          )
          $report = Join-Path $env:RUNNER_TEMP 'pt-server-module-evidence.json'
          $arguments = @('-m','tools.verify_native_module_build','--output-root',(Join-Path $env:PT_SERVER_WORKSPACE 'OutputModern'),'--report',$report)
          foreach ($module in $modules) { $arguments += @('--module',$module) }
          & python @arguments
          $exitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $report) {
            $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            "### Windows x86 server source build - $($data.status)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            foreach ($module in $modules) {
              "- $module : $($data.modules.$module.status)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            "No services, SQL databases, characters, or game client were executed." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          foreach ($module in $modules) {
            $log = Join-Path $env:PT_SERVER_WORKSPACE "Build/LogsModern/$module.log"
            if (Test-Path -LiteralPath $log) {
              $errors = @(Select-String -LiteralPath $log -Pattern 'fatal error|error C[0-9]+|error LNK[0-9]+|THIEU FILE' | Select-Object -First 8)
              if ($errors.Count) {
                Write-Host "Diagnostics from $module :"
                $errors | ForEach-Object { Write-Host $_.Line }
              }
            }
          }
          if ($exitCode -ne 0) { throw 'Fresh x86 server modules failed verification; see missing/invalid artifact matrix above' }

      - name: Upload hashes only, never binaries, runtime or raw compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-module-evidence
          path: ${{ runner.temp }}/pt-server-module-evidence.json
          if-no-files-found: warn
          retention-days: 7
