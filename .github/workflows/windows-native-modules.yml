name: Windows x86 native modules (hosted build)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-native-modules.yml'
      - 'PhongThanSource/Build/Build-Modern.ps1'
      - 'PhongThanSource/Sources/Engine/**'
      - 'PhongThanSource/Sources/Library/LuaLib/**'
      - 'PhongThanSource/Headers/**'
      - 'PhongThanSource/ThirdParty/**'
      - 'tools/verify_native_module_build.py'
      - 'tools/verify_windows_build.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-native-modules.yml'
      - 'PhongThanSource/Build/Build-Modern.ps1'
      - 'PhongThanSource/Sources/Engine/**'
      - 'PhongThanSource/Sources/Library/LuaLib/**'
      - 'PhongThanSource/Headers/**'
      - 'tools/verify_native_module_build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pt-native-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-link:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source-only module dependencies
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanSource/Build/Build-Modern.ps1
            /PhongThanSource/Headers/
            /PhongThanSource/Sources/Engine/Engine.dsp
            /PhongThanSource/Sources/Engine/Include/
            /PhongThanSource/Sources/Engine/Src/
            /PhongThanSource/Sources/Represent/iRepresent/
            /PhongThanSource/Sources/Library/LuaLib/LuaLibDll.dsp
            /PhongThanSource/Sources/Library/LuaLib/src/
            /PhongThanSource/Sources/Pack/ucl-1.01/include/
            /PhongThanSource/ThirdParty/WindowsSDK/GDIPlus/Include/
            /PhongThanSource/ThirdParty/WindowsSDK/GDIPlus/Lib/x86/
            /PhongThanSource/ThirdParty/dx9csdk/Include/
            /PhongThanSource/ThirdParty/dx9csdk/Lib/
            /tools/verify_windows_build.py
            /tools/verify_native_module_build.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make fresh external source copy; reject historical outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'PhongThanSource').Path
          foreach ($old in @('OutputModern', 'Output', 'Build/LogsModern')) {
            if (Test-Path -LiteralPath (Join-Path $source $old)) {
              throw "Refusing stale source output: $old"
            }
          }
          $workspace = Join-Path $env:RUNNER_TEMP ("pt-modules-${{ github.run_id }}-${{ github.run_attempt }}")
          if (Test-Path -LiteralPath $workspace) { throw 'Build workspace already exists' }
          Copy-Item -LiteralPath $source -Destination $workspace -Recurse -ErrorAction Stop
          "PT_MODULE_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Copied source outside checkout; staged game, PAK, SQL and player data were not downloaded.'

      - name: Compile/link LuaLibDll and Engine using MSVC x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = Join-Path $env:PT_MODULE_WORKSPACE 'Build/Build-Modern.ps1'
          if (-not (Test-Path -LiteralPath $builder)) { throw 'Build-Modern.ps1 is missing' }
          & $builder -Targets @('LuaLibDll', 'Engine') -Jobs 2 -Clean -KeepGoing
          if ($LASTEXITCODE -ne 0) { throw 'At least one source module failed to compile/link' }

      - name: Verify only freshly-built DLLs, publish per-module result
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $report = Join-Path $env:RUNNER_TEMP 'pt-native-modules.json'
          $root = Join-Path $env:PT_MODULE_WORKSPACE 'OutputModern'
          & python -m tools.verify_native_module_build --output-root $root --module LuaLibDll --module Engine --report $report
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $report) {
            $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            "### Windows x86 source build: $($data.status)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            foreach ($module in @('LuaLibDll','Engine')) {
              $result = $data.modules.$module.status
              "- $module : $result (fresh MSVC output, not staged EXE/DLL)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          foreach ($module in @('LuaLibDll','Engine')) {
            $log = Join-Path $env:PT_MODULE_WORKSPACE "Build/LogsModern/$module.log"
            if (Test-Path -LiteralPath $log) {
              $errors = @(Select-String -LiteralPath $log -Pattern 'fatal error|error C[0-9]+|error LNK[0-9]+|THIEU FILE' | Select-Object -First 12)
              if ($errors.Count) {
                Write-Host "$module build diagnostics (first 12 matching lines):"
                $errors | ForEach-Object { Write-Host $_.Line }
              }
            }
          }
          if ($code -ne 0) { throw 'Freshly-built Windows x86 module verification failed' }

      - name: Upload metadata only, no game binaries or PDB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-module-evidence
          path: ${{ runner.temp }}/pt-native-modules.json
          if-no-files-found: warn
          retention-days: 7
