name: Windows Client font and cursor regressions
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-client-ui-regressions.yml'
      - 'PhongThanSource/Sources/GameClient/Ui/Elem/UiCursor.cpp'
      - 'PhongThanSource/Sources/GameClient/Ui/Elem/CursorFallback.h'
      - 'PhongThanSource/Sources/Represent/Represent2/FontIdSelection.h'
      - 'PhongThanSource/Sources/Represent/Represent2/KRepresentShell2.cpp'
      - 'PhongThanSource/Sources/Represent/iRepresent/Font/**'
      - 'PhongThanRuntime-Staging/Client/font/**'
      - 'PhongThanRuntime-Staging/Client/Ui/**'
      - 'tests/client_cursor_fallback_test.cpp'
      - 'tests/font_id_selection_test.cpp'
      - 'tests/font_text_linebreak_test.cpp'
      - 'tests/Test-UiStatus-LegacyBytes.ps1'
      - 'tools/Audit-LegacyFont.ps1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pt-client-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  font-and-cursor:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanSource/Sources/GameClient/Ui/Elem/UiCursor.cpp
            /PhongThanSource/Sources/GameClient/Ui/Elem/CursorFallback.h
            /PhongThanSource/Sources/Represent/Represent2/FontIdSelection.h
            /PhongThanSource/Sources/Represent/Represent2/KRepresentShell2.cpp
            /PhongThanSource/Sources/Represent/iRepresent/Font/
            /PhongThanRuntime-Staging/Client/Ui/
            /PhongThanRuntime-Staging/Client/font/
            /tools/Audit-LegacyFont.ps1
            /tests/client_cursor_fallback_test.cpp
            /tests/font_id_selection_test.cpp
            /tests/font_text_linebreak_test.cpp
            /tests/Test-UiStatus-LegacyBytes.ps1
      - name: Confirm no NULL hardware cursor and correct ShowCursor state management
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath 'PhongThanSource/Sources/GameClient/Ui/Elem/UiCursor.cpp' -Raw
          $start = $source.IndexOf('void KUiCursor::SetImage(')
          $end = $source.IndexOf('int KUiCursor::SwitchImage(')
          if ($start -lt 0 -or $end -lt $start) { throw 'SetImage or SwitchImage missing' }
          $hardware = [regex]::Split($source.Substring($start, $end-$start), '(?m)^#else')[0]
          if ($hardware -notmatch 'PT_UsableCursor\(hLoaded\)') { throw 'Failed resource fallback missing' }
          if ($hardware -match 'SetCursor\(m_CursorImages\[') { throw 'Direct nullable cursor call remains' }
          if ($source -notmatch 'PT_CursorVisibilityChanged\(m_bShow, bVisible\)') { throw 'Win32 ShowCursor calls are not idempotent' }
          if ($source -notmatch 'ui_cursor_load\.log') { throw 'Missing cursor diagnosis log' }
          Write-Host 'PASS: no nullable hardware cursor and idempotent visibility'
      - name: Compile and run native Win32 cursor fallback tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Missing MSVC x86 toolchain' }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'cursor_fallback_test.exe'
          $cmd = 'call "' + $bat + '" x86 >nul && cl /nologo /W4 /EHsc /Fe:"' + $exe + '" tests\client_cursor_fallback_test.cpp user32.lib && "' + $exe + '"'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Win32 cursor smoke failed: $LASTEXITCODE" }
      - name: Verify all Represent2 text routes use same selection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content -LiteralPath 'PhongThanSource/Sources/Represent/Represent2/KRepresentShell2.cpp' -Raw
          foreach($name in @('OutputText','OutputVNText','OutputRichText','LocateRichText')) {
            $pattern='(?s)KRepresentShell2::' + $name + '\(.*?(?=\n(?:void|int) KRepresentShell2::)'
            $match=[regex]::Match($src,$pattern)
            if (-not $match.Success -or $match.Value -notmatch 'PT_SelectLoadedFont') {
              throw "Font lookup missing in $name"
            }
            if ($match.Value -notmatch 'if \(i >= 0 && m_FontTable\[i\]\.pFontObj\)') {
              throw "Safe missing-font guard missing in $name"
            }
          }
          Write-Host 'PASS: four Represent2 entry points select a loaded font'
      - name: Compile and run native selector tests with MSVC x86
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path (${env:ProgramFiles(x86)}) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x86 not installed on runner' }
          $bat=Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $exe=Join-Path $env:RUNNER_TEMP 'font_id_selection_test.exe'
          $cmd='call "' + $bat + '" x86 >nul && cl /nologo /EHsc /W4 /Fe:"' + $exe + '" tests\font_id_selection_test.cpp && "' + $exe + '"'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Font ID smoke failed: $LASTEXITCODE" }
      - name: Verify newline handling precedes legacy glyph lookup
        shell: powershell
        run: |
          $source=Get-Content -LiteralPath 'PhongThanSource/Sources/Represent/iRepresent/Font/KFont2.cpp' -Raw
          $i=$source.IndexOf('void KFont2::OutputText(')
          $loop=$source.IndexOf('while (nPos < nCount)',$i)
          $break=$source.IndexOf('PT_FontAfterLineBreak',$loop)
          $draw=$source.IndexOf('DrawCharacter(',$loop)
          if ($i -lt 0 -or $loop -lt 0 -or $break -lt $loop -or $draw -lt $break) {
            throw 'Control codes must be consumed before DrawCharacter'
          }
          if (-not $source.Contains('nHalfIndex = 0;')) { throw 'newline must reset half-width parity' }
      - name: Compile native CRLF tests using Windows MSVC x86
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x86 unavailable' }
          $bat=Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $exe=Join-Path $env:RUNNER_TEMP 'font_text_linebreak_test.exe'
          $cmd='call "' + $bat + '" x86 >nul && cl /nologo /W4 /EHsc /Fe:"' + $exe + '" tests\font_text_linebreak_test.cpp && "' + $exe + '"'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'CRLF C++ test failed' }
      - name: Audit original ASF glyphs and UI text byte sequences
        shell: powershell
        run: |
          $report=Join-Path $env:RUNNER_TEMP 'phongthan-font-coverage.json'
          & .\tools\Audit-LegacyFont.ps1 -RepoRoot (Get-Location).Path -ReportPath $report | Out-Null
          $data=Get-Content $report -Raw | ConvertFrom-Json
          if ($data.Status -ne 'AUDIT_ONLY_NOT_ENCODING_PROOF') { throw 'Unexpected audit report' }
          if (@($data.Fonts).Count -ne 3) { throw 'Font audit incomplete' }
          foreach($font in $data.Fonts) {
            if ($font.SlotCount -ne 256 -or $font.GlyphCount -ne 217) {
              throw "Unexpected ASF coverage: $($font.Name), $($font.GlyphCount) glyphs"
            }
          }
          if ($data.FilesScanned -lt 3) { throw 'No UI resources audited' }
          Write-Host "PASS read-only font audit; candidate values: $($data.FindingsCount)"
          "### Bitmap font audit" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "All three ASF fonts contain 217/256 mapped slots. Findings=$($data.FindingsCount); audit-only, not a validated encoding conversion." | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Assert restored status labels and font coverage
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\Test-UiStatus-LegacyBytes.ps1 -RepoRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: font-coverage-readonly-report
          path: ${{ runner.temp }}/phongthan-font-coverage.json
          if-no-files-found: warn
          retention-days: 7
