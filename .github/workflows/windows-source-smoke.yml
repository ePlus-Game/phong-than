name: Windows source smoke (no game process)
on:
  pull_request:
    paths:
      - '.github/workflows/windows-source-smoke.yml'
      - 'PhongThanSource/Deploy/Start-NativeServer.ps1'
      - 'PhongThanSource/Deploy/Start-StagingClient.ps1'
      - 'PhongThanSource/Deploy/Stop-StagingRuntime.ps1'
      - 'PhongThanSource/Tests/test_server_readiness.py'
      - 'PhongThanSource/Tests/Test-SkillMigrationGuards.ps1'
      - 'PhongThanSource/Sources/Core/Src/KSkillList.cpp'
      - 'PhongThanSource/Sources/Core/Src/KSkills.cpp'
      - 'PhongThanSource/Sources/Core/Src/KPlayer.cpp'
      - 'PhongThanSource/Build/Build-Modern.ps1'
      - 'PhongThanSource/Sources/MultiServer/PhongThanRelay/**'
      - 'PhongThanSource/Headers/PhongThanRelayProtocol.h'
      - 'tools/verify_windows_build.py'
      - 'tools/Build-PatchedGame.ps1'
      - 'tools/prepare_modern_build.py'
      - 'tests/test_prepare_modern_build.py'
      - 'AdminWeb/PhongThan-Setup.ps1'
      - 'AdminWeb/PhongThan-RunAll.ps1'
      - 'AdminWeb/PhongThan-ClientPatch.ps1'
      - 'PhongThan-MoGame.cmd'
      - 'PhongThan-ChayTatCa.cmd'
      - 'PhongThan-CaiDat.cmd'
      - 'tests/test_windows_launchers.py'
      - 'tools/stage_accountserver_smoke.py'
      - 'PhongThanSource/Sources/AccountServices/AccountServer/**'
      - 'PhongThanSource/Sources/MultiServer/Heaven/Interface/**'
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pt-windows-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-source-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanSource/Tests/test_server_readiness.py
            /PhongThanSource/Tests/Test-SkillMigrationGuards.ps1
            /PhongThanSource/Sources/Core/Src/KSkillList.cpp
            /PhongThanSource/Sources/Core/Src/KSkills.cpp
            /PhongThanSource/Sources/Core/Src/KPlayer.cpp
            /PhongThanSource/Sources/MultiServer/Bishop/GameServer.cpp
            /PhongThanSource/Sources/MultiServer/PhongThanRelay/
            /PhongThanSource/Headers/
            /tools/verify_windows_build.py
            /tools/stage_accountserver_smoke.py
            /tools/legacy_hardening.py
            /overlays/legacy/
            /PhongThanSource/Sources/AccountServices/AccountServer/*.cpp
            /PhongThanSource/Sources/AccountServices/AccountServer/*.h
            /PhongThanSource/Sources/AccountServices/AccountServer/*.dsp
            /PhongThanSource/Sources/AccountServices/AccountServer/*.rc
            /PhongThanSource/Sources/AccountServices/AccountServer/*.ico
            /PhongThanSource/Sources/AccountServices/AccountServer/*.tlh
            /PhongThanSource/Sources/AccountServices/AccountServer/*.tli
            /PhongThanSource/Sources/MultiServer/Heaven/Interface/
            /PhongThanSource/Deploy/Start-NativeServer.ps1
            /PhongThanSource/Deploy/Start-StagingClient.ps1
            /PhongThanSource/Deploy/Stop-StagingRuntime.ps1
            /PhongThanSource/Build/Build-Modern.ps1
            /tools/Build-PatchedGame.ps1
            /tools/prepare_modern_build.py
            /tests/test_prepare_modern_build.py
            /AdminWeb/PhongThan-Setup.ps1
            /AdminWeb/PhongThan-RunAll.ps1
            /AdminWeb/PhongThan-ClientPatch.ps1
            /PhongThan-MoGame.cmd
            /PhongThan-ChayTatCa.cmd
            /PhongThan-CaiDat.cmd
            /tests/test_windows_launchers.py
            /docs/LAUNCHER_BEHAVIOR.md
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parse Windows PowerShell 5.1 entry points
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'PhongThanSource/Deploy/Start-NativeServer.ps1',
            'PhongThanSource/Deploy/Start-StagingClient.ps1',
            'PhongThanSource/Deploy/Stop-StagingRuntime.ps1',
            'PhongThanSource/Build/Build-Modern.ps1',
            'tools/Build-PatchedGame.ps1',
            'AdminWeb/PhongThan-Setup.ps1',
            'AdminWeb/PhongThan-RunAll.ps1',
            'AdminWeb/PhongThan-ClientPatch.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "$file : $($parseErrors[0].Message)" }
            Write-Host "PASS PowerShell syntax: $file"
          }
      - name: Check Windows launcher contracts (game executable intentionally missing)
        shell: powershell
        run: python -m unittest discover -s tests -p test_windows_launchers.py -v
      - name: Verify modern build cleans stale outputs in external copy only
        shell: powershell
        run: python -m unittest discover -s tests -p test_prepare_modern_build.py -v
      - name: Native server readiness marker regression (no service startup)
        shell: powershell
        run: python -m unittest discover -s PhongThanSource/Tests -p test_server_readiness.py -v
      - name: Skill level and profession static guards
        shell: powershell
        run: '& .\PhongThanSource\Tests\Test-SkillMigrationGuards.ps1'
