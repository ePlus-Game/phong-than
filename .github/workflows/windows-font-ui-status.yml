name: Windows VNG status text bytes
on:
  pull_request:
    paths:
      - '.github/workflows/windows-font-ui-status.yml'
      - 'PhongThanRuntime-Staging/Client/Ui/ui3/UiStatus.ini'
      - 'tests/Test-UiStatus-LegacyBytes.ps1'
      - 'PhongThanRuntime-Staging/Client/font/14.fnt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-legacy-ui-bytes:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanRuntime-Staging/Client/Ui/ui3/UiStatus.ini
            /PhongThanRuntime-Staging/Client/font/14.fnt
            /tests/Test-UiStatus-LegacyBytes.ps1
      - name: Assert restored status labels and font coverage
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\tests\Test-UiStatus-LegacyBytes.ps1 -RepoRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
