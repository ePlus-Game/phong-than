name: Admin workspace UI regression
on:
  pull_request:
    paths:
      - 'AdminWeb/index.html'
      - 'AdminWeb/PhongThan-Admin.ps1'
      - 'tests/admin_workspace.test.cjs'
      - '.github/workflows/admin-workspace-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            AdminWeb
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check admin HTML/JS, 24 routes, action delegation and safe PAK state
        run: node --test tests/admin_workspace.test.cjs
  powershell-parse:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            AdminWeb
          sparse-checkout-cone-mode: true
      - name: Validate Web Admin startup script on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'AdminWeb/PhongThan-Admin.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Web Admin parser found $($errors.Count) error(s)"
          }
          Write-Host 'PASS: Windows PowerShell 5.1 syntax, no game server or SQL started.'
