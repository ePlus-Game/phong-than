name: Windows bitmap font audit and newline tests
on:
  pull_request:
    paths:
      - '.github/workflows/windows-font-bytes.yml'
      - 'PhongThanSource/Sources/Represent/iRepresent/Font/KFont2.cpp'
      - 'PhongThanSource/Sources/Represent/iRepresent/Font/FontTextLineBreak.h'
      - 'tests/font_text_linebreak_test.cpp'
      - 'tools/Audit-LegacyFont.ps1'
      - 'PhongThanRuntime-Staging/Client/font/**'
      - 'PhongThanRuntime-Staging/Client/Ui/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  font-bytes:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /PhongThanSource/Sources/Represent/iRepresent/Font/KFont2.cpp
            /PhongThanSource/Sources/Represent/iRepresent/Font/FontTextLineBreak.h
            /tests/font_text_linebreak_test.cpp
            /tools/Audit-LegacyFont.ps1
            /PhongThanRuntime-Staging/Client/font/
            /PhongThanRuntime-Staging/Client/Ui/
      - name: Verify newline handling precedes legacy glyph lookup
        shell: powershell
        run: |
          $source=Get-Content -LiteralPath 'PhongThanSource/Sources/Represent/iRepresent/Font/KFont2.cpp' -Raw
          $i=$source.IndexOf('void KFont2::OutputText(')
          $loop=$source.IndexOf('while (nPos < nCount)',$i)
          $break=$source.IndexOf('PT_FontAfterLineBreak',$loop)
          $draw=$source.IndexOf('DrawCharacter(',$loop)
          if ($i -lt 0 -or $loop -lt 0 -or $break -lt $loop -or $draw -lt $break) {
            throw 'Control codes must be consumed before DrawCharacter'
          }
          if (-not $source.Contains('nHalfIndex = 0;')) { throw 'newline must reset half-width parity' }
      - name: Compile native CRLF tests using Windows MSVC x86
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x86 unavailable' }
          $bat=Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $exe=Join-Path $env:RUNNER_TEMP 'font_text_linebreak_test.exe'
          $cmd='call "' + $bat + '" x86 >nul && cl /nologo /W4 /EHsc /Fe:"' + $exe + '" tests\font_text_linebreak_test.cpp && "' + $exe + '"'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'CRLF C++ test failed' }
      - name: Audit original ASF glyphs and UI text byte sequences
        shell: powershell
        run: |
          $report=Join-Path $env:RUNNER_TEMP 'phongthan-font-coverage.json'
          & .\tools\Audit-LegacyFont.ps1 -RepoRoot (Get-Location).Path -ReportPath $report | Out-Null
          $data=Get-Content $report -Raw | ConvertFrom-Json
          if ($data.Status -ne 'AUDIT_ONLY_NOT_ENCODING_PROOF') { throw 'Unexpected audit report' }
          if (@($data.Fonts).Count -ne 3) { throw 'Font audit incomplete' }
          foreach($font in $data.Fonts) {
            if ($font.SlotCount -ne 256 -or $font.GlyphCount -ne 217) {
              throw "Unexpected ASF coverage: $($font.Name), $($font.GlyphCount) glyphs"
            }
          }
          if ($data.FilesScanned -lt 3) { throw 'No UI resources audited' }
          Write-Host "PASS read-only font audit; candidate values: $($data.FindingsCount)"
          "### Bitmap font audit" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "All three ASF fonts contain 217/256 mapped slots. Findings=$($data.FindingsCount); audit-only, not a validated encoding conversion." | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: font-coverage-readonly-report
          path: ${{ runner.temp }}/phongthan-font-coverage.json
          if-no-files-found: warn
          retention-days: 14
